{% extends "master/base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                {% if cost_item %}
                    Ubah Rincian Biaya
                {% else %}
                    Tambah Rincian Biaya
                {% endif %}
            </h3>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="card-body">
                <div class="form-group">
                    <label>Kegiatan</label>
                    <input
                        type="text"
                        class="form-control"
                        value="{{ request_activity.rkat_activity.name }}"
                        readonly
                    >
                </div>

                <div class="form-group">
                    <label>Uraian Biaya</label>
                    <input
                        type="text"
                        name="description"
                        class="form-control"
                        value="{{ cost_item.description|default:'' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Kuantitas</label>
                    <input
                        type="number"
                        name="quantity"
                        class="form-control"
                        min="0.01"
                        step="0.01"
                        value="{{ cost_item.quantity|default:'' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Satuan</label>
                    <input
                        type="text"
                        name="unit"
                        class="form-control"
                        placeholder="Contoh: paket, orang, kali"
                        value="{{ cost_item.unit|default:'' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Harga Satuan</label>
                    <input
                        type="number"
                        name="unit_price"
                        class="form-control"
                        min="0"
                        step="0.01"
                        value="{{ cost_item.unit_price|default:'' }}"
                        required
                    >
                </div>
            </div>

            <div class="card-footer">
                <button type="submit" class="btn btn-primary">
                    Simpan
                </button>

                <a
                    href="{% url 'fund_requests:detail' fund_request.pk %}"
                    class="btn btn-secondary"
                >
                    Kembali
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
